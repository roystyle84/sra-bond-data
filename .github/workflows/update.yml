name: 국채 금리 갱신
on:
  schedule:
    # 한국시간 기준. 판정은 '전 영업일'까지 쓰므로 출근 전에 전날 값이 모두 들어오도록 맞춤
    - cron: '47 21 * * 0-5'   # 06:47 (월~토) - 전날 값 1차 반영
    - cron: '47 23 * * 0-5'   # 08:47 (월~토) - 미국 재무부(전날 미국 저녁 게시)·ECOS(한국 금리·환율) 반영
    - cron: '47 3 * * 1-5'    # 12:47 (월~금) - Bundesbank(독일) 등 늦게 올라온 값·정정치 보완
    - cron: '47 1 * * 6,0'    # 10:47 (토·일) - 금요일 미국·독일 값 재확인 (월요일 보고용)
  workflow_dispatch: {}      # Actions 화면에서 'Run workflow'로 바로 실행
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 금리 받아오기
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python fetch_bonds.py
      - name: 바뀐 값 저장
        run: |
          git config user.name  "bond-bot"
          git config user.email "bond-bot@users.noreply.github.com"
          git add data/bond.json
          git diff --cached --quiet || git commit -m "국채 금리 갱신 $(date -u +%Y-%m-%d)"
          git push
